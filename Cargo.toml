[package]
name = "rs-decimal"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Decimal arithmetic preserving the exc-works/decimal numerical contract"
license = "MIT"
repository = "https://github.com/exc-works/rs-decimal"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
num-rational = "=0.4.2"
ryu = "=1.0.23"

[features]
default = []

[workspace]
members = ["tools/conformance"]
resolver = "2"
