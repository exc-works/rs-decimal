[package]
name = "rs-decimal"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Decimal arithmetic preserving the exc-works/decimal numerical contract"
license = "MIT"
repository = "https://github.com/exc-works/rs-decimal"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
num-rational = "=0.4.2"
ryu = "=1.0.23"
serde = { version = "=1.0.228", optional = true }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"], optional = true }

yaml-rust2 = { version = "=0.13.0", default-features = false, optional = true }

quick-xml = { version = "=0.38.4", optional = true }

[features]
default = []
bson = []
serde = ["dep:serde"]
json = ["dep:serde_json"]
yaml = ["dep:yaml-rust2"]
xml = ["dep:quick-xml"]

[workspace]
members = ["tools/conformance"]
resolver = "2"
