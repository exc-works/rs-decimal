[package]
name = "decimal-postgres-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
rs-decimal = { path = "../..", features = ["postgres"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time"] }
