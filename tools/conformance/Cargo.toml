[package]
name = "decimal-conformance"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
rs-decimal = { path = "../..", features = ["json", "serde", "yaml", "xml", "bson", "validation", "config"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
