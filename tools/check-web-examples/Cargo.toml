[package]
name = "decimal-web-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
rs-decimal = { path = "../..", default-features = false, features = ["bson", "config", "json", "postgres", "validation", "xml", "yaml"] }
serde_json = "=1.0.145"

serde = { version = "=1.0.228", features = ["derive"] }

sqlx = { version = "=0.8.6", default-features = false, features = ["postgres"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time"], optional = true }

[features]
postgres-live = ["dep:tokio", "sqlx/runtime-tokio"]

[build-dependencies]
serde_json = "=1.0.145"
