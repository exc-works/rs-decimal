name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --release
      - run: cargo check --locked --no-default-features
      - run: cargo test --locked -p rs-decimal --no-default-features
      - run: cargo test --locked -p rs-decimal --no-default-features --features serde
      - run: cargo test --locked -p rs-decimal --no-default-features --features json
      - run: cargo test --locked -p rs-decimal --no-default-features --features yaml
      - run: cargo test --locked -p rs-decimal --all-features
      - run: cargo package --locked
      - run: cargo test --locked --all-features --manifest-path target/package/rs-decimal-0.1.0-alpha.1/Cargo.toml
      - run: cargo run --locked --manifest-path target/package/rs-decimal-0.1.0-alpha.1/Cargo.toml --example core
      - run: python3 tools/check-baseline.py
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: exc-works/decimal
          ref: a8791208e2d15483cf652cd2814b74b0c1a84187
          path: .cache/go-source
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false
      - run: go run tools/api-inventory/main.go .cache/go-source > .cache/api-inventory.json
      - run: diff -u docs/api-inventory.json .cache/api-inventory.json
      - run: python3 tools/check-baseline.py --source .cache/go-source
      - run: python3 tools/test-baseline.py --source .cache/go-source
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: tools/go-reference/go.sum
      - run: cargo build --locked -p decimal-conformance
      - run: mkdir -p .cache
      - run: go build -mod=readonly -o ../../.cache/go-reference .
        working-directory: tools/go-reference
      - run: go test ./...
        working-directory: tools/go-oracle
      - run: go build -o ../../.cache/go-oracle .
        working-directory: tools/go-oracle
      - run: python3 tools/conformance/test_driver.py
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/state.jsonl
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/representation.jsonl
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/rounding.jsonl
      - run: python3 tools/conformance/check-oracle.py --rust target/debug/decimal-conformance --oracle .cache/go-oracle --cases testdata/conformance/rounding.jsonl --operations rescale
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/arithmetic.jsonl
      - run: python3 tools/conformance/check-oracle.py --rust target/debug/decimal-conformance --oracle .cache/go-oracle --cases testdata/conformance/arithmetic.jsonl --operations add sub mul mul_exact mul_prec quo quo_prec power
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/conversion.jsonl --timeout 60
      - run: python3 tools/conformance/check-floats.py --rust target/debug/decimal-conformance --cases testdata/conformance/conversion.jsonl
      - run: python3 tools/conformance/smoke-oracle.py .cache/go-oracle
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/roots.jsonl
      - run: python3 tools/conformance/check-oracle.py --rust target/debug/decimal-conformance --oracle .cache/go-oracle --cases testdata/conformance/roots.jsonl --operations sqrt root sqrt_prec root_prec
      - run: python3 tools/conformance/check-must-succeed.py --rust target/debug/decimal-conformance --oracle .cache/go-oracle
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/transcendentals.jsonl
      - run: python3 tools/conformance/check-oracle.py --rust target/debug/decimal-conformance --oracle .cache/go-oracle --cases testdata/conformance/transcendentals.jsonl --operations ln log2 log10 exp ln_prec log2_prec log10_prec exp_prec
      - run: python3 tools/conformance/run.py --go .cache/go-reference --rust target/debug/decimal-conformance --cases testdata/conformance/formatting.jsonl
      - run: python3 tools/conformance/check-binary.py --go .cache/go-reference --rust target/debug/decimal-conformance
      - run: cargo build --locked --release -p decimal-conformance
      - run: python3 tools/conformance/core-gates.py --go .cache/go-reference --rust target/release/decimal-conformance --oracle .cache/go-oracle
      - uses: actions/upload-artifact@v4
        with:
          name: core-gates-64
          path: .cache/core-gates.json
  paired-32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: tools/go-reference/go.sum
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --locked --target i686-unknown-linux-gnu --workspace
      - run: cargo test --locked --target i686-unknown-linux-gnu --workspace --release
      - run: cargo build --locked --target i686-unknown-linux-gnu --release -p decimal-conformance
      - run: mkdir -p .cache
      - run: GOARCH=386 go build -mod=readonly -o ../../.cache/go-reference-32 .
        working-directory: tools/go-reference
      - run: GOARCH=386 go build -o ../../.cache/go-oracle-32 .
        working-directory: tools/go-oracle
      - run: python3 tools/conformance/core-gates.py --native-bits 32 --go .cache/go-reference-32 --rust target/i686-unknown-linux-gnu/release/decimal-conformance --oracle .cache/go-oracle-32
      - run: python3 tools/conformance/check-binary.py --native-bits 32 --go .cache/go-reference-32 --rust target/i686-unknown-linux-gnu/release/decimal-conformance
      - run: python3 tools/conformance/check-must-succeed.py --rust target/i686-unknown-linux-gnu/release/decimal-conformance --oracle .cache/go-oracle-32
      - uses: actions/upload-artifact@v4
        with:
          name: core-gates-32
          path: .cache/core-gates.json
