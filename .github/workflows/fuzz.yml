name: Extended differential fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - run: cargo build --locked --release -p decimal-conformance
      - run: mkdir -p .cache
      - run: go build -tags bson -mod=readonly -o ../../.cache/go-reference .
        working-directory: tools/go-reference
      - run: go build -o ../../.cache/go-oracle .
        working-directory: tools/go-oracle
      - run: python3 tools/conformance/fuzz.py --go .cache/go-reference --rust target/release/decimal-conformance --oracle .cache/go-oracle --seconds 900 --seed "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-report-and-reproducer
          path: .cache/fuzz-*.json
