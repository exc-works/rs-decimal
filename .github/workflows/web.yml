name: Web bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '157.0.8103.78'
          install-chromedriver: true
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: python3 tools/build-web-wasm.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo run --locked -p decimal-web-examples
      - run: node --test website/tests/bridge.test.mjs website/tests/resources.test.mjs website/tests/constructors.test.mjs website/tests/comparison.test.mjs website/tests/helpers.test.mjs website/tests/types.test.mjs website/tests/rounding.test.mjs website/tests/examples.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm run build:runner
        working-directory: website
        env:
          RUNNER_PARENT_ORIGINS: '["http://127.0.0.1:4210"]'
          RUNNER_ALLOW_LOCALHOST: '1'
      - run: node --test website/tests/protocol.test.mjs
      - run: node --test website/tests/draft.test.mjs
      - run: python3 website/tests/browser-runner.py
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run build
        working-directory: website
        env:
          DOCS_BASE: /rs-decimal/
          DOCS_RUNNER_URL: http://127.0.0.1:4211/
      - run: python3 website/tests/browser-editor.py
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - name: Select the matching browser binary
        run: python3 -c 'import json, os; open("webdriver.json", "w").write(json.dumps({"goog:chromeOptions":{"binary":os.environ["TEST_CHROME_BINARY"]}}))'
        env:
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - run: cargo test --locked -p decimal-playground-bridge --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/webdriver.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-proof
          path: |
            website/public/wasm/
            website/runner-dist/
