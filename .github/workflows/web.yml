name: Web bridge
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '157.0.8103.78'
          install-chromedriver: true
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - name: Build the single-site static package
        run: npm run build:release
        working-directory: website
        env:
          DOCS_BASE: /rs-decimal/
      - run: cargo run --locked -p decimal-web-examples
      - run: npm run test:bridge
        working-directory: website
      - run: node --test website/tests/protocol.test.mjs
      - run: node --test website/tests/draft.test.mjs
      - run: node --test website/tests/transfer.test.mjs
      - run: python3 website/tests/browser-runner.py
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - run: python3 website/tests/browser-editor.py
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pull matching Playwright browsers and system libraries
        id: browsers
        timeout-minutes: 10
        working-directory: website
        run: |
          version=$(node -p "require('playwright/package.json').version")
          image="mcr.microsoft.com/playwright:v${version}-noble"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Test Chromium, Firefox and WebKit
        working-directory: website
        env:
          BROWSER_IMAGE: ${{ steps.browsers.outputs.image }}
        run: |
          mkdir -p ../.cache
          docker run --rm --init --shm-size=1g --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/work/website:ro" --volume "$PWD/../.cache:/work/.cache" \
            --workdir /work/website "$BROWSER_IMAGE" node tests/browser-engines.mjs
      - name: Select the matching browser binary
        run: python3 -c 'import json, os; open("webdriver.json", "w").write(json.dumps({"goog:chromeOptions":{"binary":os.environ["TEST_CHROME_BINARY"]}}))'
        env:
          TEST_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
      - run: cargo test --locked -p decimal-playground-bridge --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/webdriver.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-proof
          include-hidden-files: true
          path: |
            website/public/wasm/
            website/public/runner/
            website/release-dist/
            .cache/browser-engines.json
