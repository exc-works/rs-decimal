[package]
name = "decimal-playground-bridge"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rs-decimal = { path = "../..", default-features = false, features = ["bson", "json", "validation", "xml", "yaml"] }
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }

yaml-rust2 = { version = "=0.13.0", default-features = false }
quick-xml = "=0.38.4"

[dev-dependencies]
wasm-bindgen-test = "=0.3.55"
