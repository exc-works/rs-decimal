[package]
name = "decimal-playground-bridge"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rs-decimal = { path = "../..", default-features = false }
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
serde_json = "=1.0.145"

[dev-dependencies]
wasm-bindgen-test = "=0.3.55"
